## Gradle JVM args
## NOTE: Setting these too high can crash the Gradle daemon on Windows with "Native memory allocation failed".
## This project previously used -Xmx8G which caused hs_err_pid*.log JVM crashes.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

## Reduce parallelism to lower peak memory usage during transforms/dexing (stability > speed).
org.gradle.workers.max=4
android.useAndroidX=true
android.enableJetifier=true
